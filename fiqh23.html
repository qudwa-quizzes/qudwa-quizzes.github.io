<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>كويز النكاح</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one column like a stack of slides; the deck's cover world is the page, each question is a light slide card. */
:root{
  --c-bg:radial-gradient(ellipse at 50% 0%,#7c8c44 0%,transparent 60%),linear-gradient(180deg,#56632a 0%,#3d4720 100%); --c-ink:#fbf6e8; --c-tc:#fff; --c-hl:#f2c66d; --c-sub:#e3e7c9;
  --btn:#f2c66d; --btn-fg:#3d4720;
  --l-bg:radial-gradient(circle at 100% 0%,#f6dcd4 0%,transparent 40%),linear-gradient(180deg,#fdfaf2 0%,#f7f0de 100%); --l-ink:#2e3318; --l-tc:#3d4720; --l-hl:#b85a48; --l-sub:#6d6f5a;
  --l-card:#fff; --l-bd:2px solid #e9dcbc; --l-num:#c9705f; --l-numfg:#fff;
  --ok:#6b7a35; --panel:var(--c-bg); --no:#c94a3a;
  --tf:'Rubik','Tajawal',system-ui,sans-serif; --bf:'Noto Kufi Arabic','Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--c-bg)}
body{margin:0;min-height:100%;background:var(--c-bg);color:var(--c-ink);font-family:var(--bf);font-size:17px;line-height:1.75;direction:rtl}
.wrap{max-width:740px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;gap:12px}
.cover{display:block;width:100%;max-width:100%;aspect-ratio:1376/768;object-fit:cover;border-radius:18px;border:2px solid var(--c-hl);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.tag{align-self:flex-start;font-family:var(--tf);font-weight:700;font-size:.85rem;padding:3px 14px;border-radius:30px;background:var(--c-hl);color:var(--btn-fg)}
h1{margin:0;font-family:var(--tf);font-weight:700;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.35;color:var(--c-tc);text-wrap:balance}
h1 small{display:block;font-size:.5em;color:var(--c-hl);font-weight:700}
.intro{margin:0;color:var(--c-sub);font-size:1rem}
.name{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.name label{font-weight:700}
.req{color:var(--c-hl);font-size:.85em}
.logo{align-self:center;height:56px;width:auto;max-width:100%}
.who{font-weight:700;color:var(--c-ink);font-size:.95rem}
.send{display:inline-block;margin-top:10px;text-decoration:none}
.name input.need{border-color:var(--no);box-shadow:0 0 0 3px var(--no)}
.name input{flex:1;min-width:0;max-width:320px;font:inherit;padding:8px 14px;border-radius:12px;border:2px solid var(--c-hl);background:rgba(255,255,255,.92);color:#222}
.q{color-scheme:light;position:relative;background:var(--l-bg);color:var(--l-ink);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.qh{display:flex;gap:12px;align-items:flex-start}
.n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--tf);font-weight:700;font-size:1.15rem;background:var(--l-num);color:var(--l-numfg)}
.qt{min-width:0;display:flex;flex-direction:column;gap:2px}
.kind{font-size:.8rem;font-weight:700;color:var(--l-sub);letter-spacing:.02em}
.qtext{margin:0;font-weight:700;font-size:1.08rem;color:var(--l-tc);line-height:1.8}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px dotted var(--l-hl);margin:0 4px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--l-card);border:var(--l-bd);cursor:pointer;transition:transform .12s}
.opt:hover{transform:translateY(-1px)}
.opt input{accent-color:var(--l-num);width:20px;height:20px;flex:none;margin:0}
.opt span{min-width:0}
.opt:has(input:checked){outline:3px solid var(--l-hl);outline-offset:-1px}
.opt:has(input:focus-visible){outline:3px dashed var(--l-hl)}
.txt{width:100%;font:inherit;padding:10px 14px;border-radius:14px;border:var(--l-bd);background:var(--l-card);color:var(--l-ink)}
textarea.txt{min-height:110px;resize:vertical}
.txt:focus-visible,.name input:focus-visible{outline:3px solid var(--l-hl);outline-offset:1px}
.fb{display:none;border-radius:14px;padding:10px 14px;font-size:.98rem;line-height:1.8}
.done .fb{display:block}
.fb b{display:block}
.q.good .fb{background:color-mix(in srgb,var(--ok) 14%,transparent);border:2px solid var(--ok)}
.q.bad .fb{background:color-mix(in srgb,var(--no) 12%,transparent);border:2px solid var(--no)}
.q.essay .fb{background:color-mix(in srgb,var(--l-hl) 12%,transparent);border:2px dashed var(--l-hl)}
.q.good .fb b{color:var(--ok)} .q.bad .fb b{color:var(--no)} .q.essay .fb b{color:var(--l-tc)}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.opt.wrong{border-color:var(--no);box-shadow:inset 0 0 0 2px var(--no)}
.done .opt{cursor:default}
.mark{position:absolute;top:14px;left:14px;width:30px;height:30px;border-radius:50%;display:none;place-items:center;color:#fff;font-weight:700}
.q.good .mark{display:grid;background:var(--ok)} .q.bad .mark{display:grid;background:var(--no)}
.actions{display:flex;flex-direction:column;align-items:center;gap:8px}
.btn{font:inherit;font-family:var(--tf);font-weight:700;font-size:1.2rem;padding:12px 34px;border-radius:40px;border:0;background:var(--btn);color:var(--btn-fg);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:focus-visible{outline:3px solid var(--c-tc);outline-offset:3px}
.warn{margin:0;color:var(--c-hl);font-weight:700;text-align:center}
.result{border-radius:22px;padding:22px 18px;background:var(--panel);box-shadow:0 14px 40px rgba(0,0,0,.3);border:2px solid var(--c-hl);display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.mascot{width:120px;height:120px;flex:none;color:var(--c-hl);filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.mascot.img{object-fit:cover;object-position:20% 50%;border-radius:50%;border:3px solid var(--c-hl)}
.rs{min-width:0;flex:1 1 240px;display:flex;flex-direction:column;gap:4px}
.score{font-family:var(--tf);font-weight:700;font-size:2.6rem;line-height:1.2;color:var(--c-hl);font-variant-numeric:tabular-nums}
.msg{font-weight:700;font-size:1.15rem;color:var(--c-tc)}
.note{font-size:.92rem;color:var(--c-sub)}
.foot{text-align:center;font-size:.85rem;color:var(--c-sub);opacity:.85}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <h1><small>اختبر نفسك</small>النكاح</h1>
    <p class="intro">سبعة أسئلة: اختيار من متعدد، وأكمل، وسؤال مقالي. أجب عنها كلها ثم اضغط «أظهر النتيجة» لترى درجتك والتصويبات.</p>

<script>
const Q=[{"t": "fill", "q": "قال النبي ﷺ: «خيركم خيركم لـ___، وأنا خيركم لأهلي».", "a": ["أهله", "اهله"], "e": "وتكون خير الناس لأهلك من الآن: ببرّك بوالديك ورفقك بإخوتك."}, {"t": "mcq", "q": "أمك تُعدّ الطعام وتنظف المطبخ، وأنت جالس تلعب. ماذا تفعل؟", "o": ["أخرج من البيت", "أطلب منها أن تسرع", "أكمل اللعب", "أقوم وأساعدها اقتداءً بالنبي ﷺ"], "a": 3, "e": "كان النبي ﷺ يكون في مهنة أهله، أي في خدمتهم ومساعدتهم.", "s": 1}, {"t": "mcq", "q": "قال صديقك: «أهم شيء في الحياة أن أصبح غنيًا فقط». كيف تصحح له بحسب الدرس؟", "o": ["المال أهم من كل شيء", "الدين والخلق أغلى ما يملكه الإنسان", "الشهرة أهم من الدين", "الجمال وحده يكفي"], "a": 1, "e": "قال ﷺ: إذا جاءكم من ترضون دينه وخلقه فزوّجوه. فاجتهد في دينك وخلقك من الآن.", "s": 1}, {"t": "mcq", "q": "ما شروط الزواج في الإسلام الثلاثة؟", "o": ["الصورة، والإعلان، والطعام", "الحفلة، والهدايا، والسفر", "الولي، والشاهدان، والمهر", "المال، والبيت، والسيارة"], "a": 2, "e": "قال ﷺ: لا نكاح إلا بولي وشاهدي عدل. والمهر حق للمرأة نفسها."}, {"t": "fill", "q": "إذا تزوج أحد فهنّئه بقولك: «بارك الله لك، وبارك عليك، وجمع بينكما في ___».", "a": ["خير"], "e": "ويحب الإسلام إعلان الزواج وإظهار الفرح به؛ قال ﷺ: أعلنوا النكاح."}, {"t": "mcq", "q": "أخوك الصغير يلعب بجانبك ويزعجك وأنت تذاكر. كيف تكون «خير الناس لأهلك»؟", "o": ["أصرخ عليه وأضربه", "أكلمه برفق وأقترح عليه لعبة هادئة", "أطرده من الغرفة بقسوة", "أشتكيه دائمًا"], "a": 1, "e": "قال ﷺ: خيركم خيركم لأهله. وتكون كذلك من الآن بالرفق بإخوتك وبرّ والديك.", "s": 1}, {"t": "essay", "q": "«الدين والخلق أغلى ما تملك». اكتب كيف تبني دينك وخلقك من الآن، وكيف تكون «خير الناس لأهلك» في بيت والديك.", "m": "أبني ديني بالمحافظة على الصلاة وقراءة القرآن وتعلم الفقه، وخلقي بالصدق والأمانة والحلم. وأكون خيرًا لأهلي بأن أبرّ والديّ وأطيعهما، وأساعد أمي في أعمال البيت كما كان النبي ﷺ في مهنة أهله، وأرفق بإخوتي الصغار ولا أصرخ عليهم. وأغض بصري وأحفظ نفسي من الحرام، وأصوم أيامًا من الشهر، وأدعو: ربنا هب لنا من أزواجنا وذرياتنا قرة أعين.", "s": 1}];
const LESSON="الفقه 23 - النكاح";
const FORM={"url": "https://docs.google.com/forms/d/e/1FAIpQLSfyjIsOctLOcUTosXSoKAtAspjStFhqSf3Ef7TcUlqjLdrI5A/viewform", "name": "entry.170516688", "lesson": "entry.1265407028", "score": "entry.1221539964"};
const AR=n=>Number(n).toLocaleString('ar-EG');
const KIND={mcq:'اختر الإجابة الصحيحة',fill:'أكمل الفراغ',essay:'سؤال مقالي (لا يدخل في الدرجة)'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const box=document.getElementById('qs');
Q.forEach((q,i)=>{
  const el=document.createElement('article');el.className='q';el.id='q'+i;
  let body='';
  const text=esc(q.q).replace(/_{3,}/g,'<span class="blank"></span>');
  if(q.t==='mcq') body='<div class="opts" role="radiogroup">'+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="r${i}" id="r${i}_${j}" value="${j}"><span>${esc(o)}</span></label>`).join('')+'</div>';
  if(q.t==='fill') body=`<input class="txt" id="f${i}" type="text" autocomplete="off" placeholder="اكتب الكلمة الناقصة">`;
  if(q.t==='essay') body=`<textarea class="txt" id="e${i}" placeholder="اكتب إجابتك بأسلوبك"></textarea>`;
  el.innerHTML=`<span class="mark" aria-hidden="true"></span><div class="qh"><span class="n">${AR(i+1)}</span><div class="qt"><span class="kind">${q.s?(q.t=='essay'?'موقف: كيف تتصرف؟ (مقالي، لا يدخل في الدرجة)':'موقف: كيف تتصرف؟'):KIND[q.t]}</span><p class="qtext">${text}</p></div></div>${body}<div class="fb" aria-live="polite"></div>`;
  box.appendChild(el);
});
const norm=s=>String(s).replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي0-9a-z ]/gi,' ').replace(/\s+/g,' ').trim();
const noal=s=>s.split(' ').map(w=>w.replace(/^(و|ف|ب|ل)?ال(?=..)/,'')).join(' ');
function fillOK(v,acc){const I=norm(v);if(!I)return false;const I2=noal(I);
  return acc.some(a=>{const A=norm(a),A2=noal(A);return I===A||I2===A2||(' '+I+' ').includes(' '+A+' ')||(' '+I2+' ').includes(' '+A2+' ')})}
const go=document.getElementById('go'),warn=document.getElementById('warn');let warned=false;
function answered(q,i){if(q.t==='mcq')return!!document.querySelector(`input[name="r${i}"]:checked`);if(q.t==='fill')return norm(document.getElementById('f'+i).value)!=='';return true}
go.addEventListener('click',()=>{
  const nmEl=document.getElementById('sname');
  if(nmEl.value.trim().length<3){nmEl.classList.add('need');warn.hidden=false;warn.textContent='اكتب اسمك أولًا في أعلى الصفحة، ثم اضغط «أظهر النتيجة».';nmEl.scrollIntoView({block:'center'});nmEl.focus();return}
  nmEl.classList.remove('need');nmEl.readOnly=true;
  const miss=Q.map((q,i)=>answered(q,i)?null:i+1).filter(Boolean);
  if(miss.length&&!warned){warned=true;warn.hidden=false;warn.textContent=`لم تُجب بعد عن السؤال ${miss.map(AR).join('، ')}. أكمل إجابتك، أو اضغط مرة أخرى لترى النتيجة.`;go.textContent='أظهر النتيجة على أي حال';return}
  let s=0,t=0;
  Q.forEach((q,i)=>{const el=document.getElementById('q'+i),fb=el.querySelector('.fb');el.classList.add('done');
    if(q.t==='essay'){el.classList.add('essay');fb.innerHTML=`<b>إجابة نموذجية للمقارنة:</b>${esc(q.m)}`;return}
    t++;let ok=false;
    if(q.t==='mcq'){const c=document.querySelector(`input[name="r${i}"]:checked`);ok=c&&+c.value===q.a;
      el.querySelectorAll('.opt').forEach((o,j)=>{if(j===q.a)o.classList.add('right');else if(c&&+c.value===j)o.classList.add('wrong')});
      el.querySelectorAll('input').forEach(x=>x.disabled=true);
      fb.innerHTML=(ok?'<b>إجابة صحيحة، أحسنت!</b>':`<b>الإجابة الصحيحة: ${esc(q.o[q.a])}</b>`)+esc(q.e||'');}
    else{const f=document.getElementById('f'+i);ok=fillOK(f.value,q.a);f.readOnly=true;
      fb.innerHTML=(ok?'<b>إجابة صحيحة، أحسنت!</b>':`<b>الإجابة الصحيحة: ${esc(q.a[0])}</b>`)+esc(q.e||'');}
    if(ok)s++;el.classList.add(ok?'good':'bad');el.querySelector('.mark').textContent=ok?'✓':'✗';
  });
  const nm=document.getElementById('sname').value.trim();
  const d=new Date();document.getElementById('who').textContent=`${nm} · ${LESSON} · ${d.toLocaleDateString('ar-EG')} ${d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}`;
  if(FORM){const u=new URL(FORM.url);u.searchParams.set('usp','pp_url');u.searchParams.set(FORM.name,nm);u.searchParams.set(FORM.lesson,LESSON);u.searchParams.set(FORM.score,`${s} / ${t}`);document.getElementById('send').href=u.toString();document.getElementById('sendwrap').hidden=false}
  const r=s/t;const who=nm?` يا ${nm}`:' يا بطل';
  document.getElementById('score').textContent=`${AR(s)} من ${AR(t)}`;
  document.getElementById('msg').textContent=r===1?`ممتاز${who}! إجاباتك كلها صحيحة.`:r>=.67?`أحسنت${who}! راجع التصويبات لتكمل الصورة.`:r>=.34?`بداية طيبة${who}. راجع التصويبات وشاهد الدرس مرة أخرى.`:`لا بأس${who}، شاهد الدرس من جديد ثم أعد المحاولة.`;
  warn.hidden=true;go.hidden=true;const res=document.getElementById('res');res.hidden=false;
  res.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
});
document.getElementById('again').addEventListener('click',()=>{
  document.querySelectorAll('.q').forEach(el=>{el.className='q';el.querySelector('.fb').innerHTML='';el.querySelector('.mark').textContent=''});
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('right','wrong'));
  document.querySelectorAll('.q input,.q textarea').forEach(x=>{x.disabled=false;x.readOnly=false;if(x.type==='radio')x.checked=false;else x.value=''});
  document.getElementById('res').hidden=true;go.hidden=false;go.textContent='أظهر النتيجة';warned=false;
  document.getElementById('sname').readOnly=false;window.scrollTo({top:0,behavior:'auto'});
});
</script>
</body></html>
