<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبارات قطر الندى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a single reading column like a study notebook; the index groups quizzes under the book's chapters, each quiz opens in place with its answer sheet. */
:root {
  --bg: #f3f5f4;
  --paper: #ffffff;
  --ink: #18212b;
  --muted: #5b6672;
  --line: #d9dfe2;
  --accent: #1f4e6b;
  --accent-soft: #e2edf3;
  --gold: #9a6b12;
  --ok: #1d6b45;
  --ok-soft: #e3f2e9;
  --bad: #a3322a;
  --bad-soft: #f8e5e3;
  --display: "Aref Ruqaa", "Noto Naskh Arabic", "Amiri", serif;
  --body: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
  --ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171c; --paper: #182128; --ink: #e6ebee; --muted: #9aa7b1; --line: #2c3842;
  --accent: #8cc0de; --accent-soft: #1d3342; --gold: #e0b55c;
  --ok: #7fd3a4; --ok-soft: #173326; --bad: #f19a90; --bad-soft: #3a1f1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171c; --paper: #182128; --ink: #e6ebee; --muted: #9aa7b1; --line: #2c3842;
  --accent: #8cc0de; --accent-soft: #1d3342; --gold: #e0b55c;
  --ok: #7fd3a4; --ok-soft: #173326; --bad: #f19a90; --bad-soft: #3a1f1c; color-scheme: dark }

* { box-sizing: border-box; }
html, body { direction: rtl; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.85; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: grid; gap: 6px; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.eyebrow { font-family: var(--ui); font-size: 13px; letter-spacing: .02em; color: var(--gold); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 42px); line-height: 1.4; margin: 0; color: var(--accent); text-wrap: balance; }
.lede { margin: 0; color: var(--muted); font-size: 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--ui); font-size: 14px; color: var(--muted); margin-top: 6px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }

.chapter { margin-top: 26px; }
.chapter h2 { font-family: var(--ui); font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin: 0 0 8px; }
.list { display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: 2.6em 1fr auto; align-items: center; gap: 12px; padding: 12px 16px;
  border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; text-align: right; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.num { font-family: var(--ui); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rt { min-width: 0; }
.rt .t { display: block; font-weight: 600; font-size: 17px; line-height: 1.6; }
.rt .p { display: block; font-family: var(--ui); font-size: 12.5px; color: var(--muted); }
.pill { font-family: var(--ui); font-size: 13px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.none { color: var(--muted); border: 1px solid var(--line); }
.pill.good { background: var(--ok-soft); color: var(--ok); }
.pill.weak { background: var(--bad-soft); color: var(--bad); }

/* quiz view */
.back { font-family: var(--ui); font-size: 14px; border: 0; background: none; color: var(--accent); padding: 0; margin-bottom: 14px; }
.qhead { display: grid; gap: 6px; margin-bottom: 18px; }
.qhead h1 { font-size: clamp(24px, 5vw, 32px); }
.qhead .meta { font-family: var(--ui); font-size: 13px; color: var(--muted); }
.qhead .desc { margin: 0; color: var(--muted); font-size: 16px; }
ol.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.q { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.q.ok { border-color: var(--ok); }
.q.bad { border-color: var(--bad); }
.q .qt { display: flex; gap: 10px; font-weight: 600; margin: 0 0 10px; }
.q .qt .n { font-family: var(--ui); color: var(--gold); font-weight: 600; flex: none; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; line-height: 1.7; }
.opt:hover { background: var(--accent-soft); }
.opt input { margin-top: .55em; accent-color: var(--accent); flex: none; }
.opt .l { font-family: var(--ui); color: var(--muted); font-size: 14px; flex: none; margin-top: .2em; }
.opt.correct { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.locked .opt { cursor: default; }
.locked .opt:hover { background: transparent; }
.locked .opt.correct:hover { background: var(--ok-soft); }
.locked .opt.wrong:hover { background: var(--bad-soft); }
.fb { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 16px; background: var(--bg); }
.fb .v { font-family: var(--ui); font-weight: 600; font-size: 14px; display: block; }
.q.ok .fb .v { color: var(--ok); }
.q.bad .fb .v { color: var(--bad); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 20px; }
.btn { font-family: var(--ui); font-size: 15px; font-weight: 600; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--paper); }
.btn.ghost { background: transparent; color: var(--accent); }
.hint { font-family: var(--ui); font-size: 14px; color: var(--bad); }
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
.score .big { font-family: var(--ui); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.score .msg { color: var(--muted); font-size: 16px; }
footer { margin-top: 36px; font-family: var(--ui); font-size: 12.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
@media (max-width: 480px) { body { font-size: 17px; } .row { padding: 10px 12px; gap: 10px; } .q { padding: 14px; } }
</style>
</head>

<script type="application/json" id="quiz-data">[{"n":1,"main":"مقدمات","title":"الكلمة وأقسامها، والاسم المعرب والمبني","pages":"6","description":"يغطي تعريف الكلمة وأقسامها الثلاثة، وعلامات الاسم، وتقسيم الاسم إلى معرب ومبني، وأنواع البناء كما في المتن (ص6–7).","questions":[{"q":"ما تعريف الكلمة عند المصنف؟","options":["قول مفرد","لفظ مفيد","قول مركب يحسن السكوت عليه","لفظ دال على معنى مقترن بزمن"],"answer":0,"feedback":"قال المصنف: «الكلمة قول مفرد». أما «اللفظ المفيد» فهو تعريفه للكلام لا للكلمة."},{"q":"ما المعرب في اصطلاح المصنف؟","options":["ما يقبل أل والتنوين معًا","ما يلزم آخره حالة واحدة مهما تغيرت العوامل","ما تُقدَّر على آخره الحركات جميعها","ما يتغير آخره بسبب العوامل الداخلة عليه"],"answer":3,"feedback":"نص المتن: «مُعرَبٌ وهو ما يتغير آخره بسبب العوامل الداخلة عليه»، والمبني بخلافه."},{"q":"بأي مثال مثّل المصنف لعلامة «الحديث عنه» في الاسم؟","options":["أل في «الرجل»","تاء «ضربتُ»","تنوين «رجلٍ»","تاء «قامتْ»"],"answer":1,"feedback":"قال: «وبالحديث عنه كتاء ضربتُ». أما تاء «قامتْ» الساكنة فهي علامة الفعل الماضي."},{"q":"ما أصل البناء عند المصنف؟","options":["الكسر","الضم","السكون","الفتح"],"answer":2,"feedback":"قال في «كمْ ومنْ»: «في لزوم السكون وهو أصل البناء»."},{"q":"متى تُبنى «قبلُ» و«بعدُ» على الضم بحسب المتن؟","options":["إذا حُذف المضاف إليه ونُوي لفظه","إذا أُضيفتا إلى اسم معرفة ظاهر","إذا قُطعتا عن الإضافة لفظًا ومعنى","إذا حُذف المضاف إليه ونُوي معناه"],"answer":3,"feedback":"قيّد المصنف بناءهما على الضم بقوله: «إذا حُذف المضاف إليه ونُوي معناه»."},{"q":"ما الفرق في نوع البناء بين «هؤلاءِ» و«أحدَ عشرَ»؟","options":["الأول يلزم الكسر، والثاني يلزم الفتح","كلاهما يلزم الكسر","الأول يلزم الفتح، والثاني يلزم الكسر","الأول يلزم الضم، والثاني يلزم الفتح"],"answer":0,"feedback":"مثّل المصنف بـ«هؤلاءِ» للزوم الكسر، وبـ«أحدَ عشرَ وأخواته» للزوم الفتح."},{"q":"إلى من نسب المصنف بناء «حذامِ» و«أمسِ» على الكسر؟","options":["إلى لغة طيئ","إلى جميع العرب","إلى لغة الحجازيين","إلى لغة بني تميم"],"answer":2,"feedback":"قال: «وكذلك حذامِ وأمسِ في لغة الحجاز اجه","لا يُضمر فيه شيء"],"answer":2,"feedback":"قال: «فيُضمر في الثاني كل ما يحتاجه»."},{"q":"ماذا يُضمر في الأول إذا أُعمل الثاني؟","options":["لا يُضمر فيه شيء","كل ما يحتاجه","منصوبه فقط","مرفوعه فقط"],"answer":3,"feedback":"قال: «فيُضمر في الأول مرفوعه فقط»."},{"q":"لماذا ليس قول الشاعر: «كفاني - ولم أطلب - قليلٌ من المال» من التنازع؟","options":["لأن العاملين اسمان","لفساد المعنى لو وُجّه «أطلب» إلى «قليل»","لأن الفعل الثاني منفي فلا يعمل","لأن «قليل» نكرة"],"answer":1,"feedback":"قال المصنف: «وليس منه... لفساد المعنى»؛ لأنه لو وُجّه «أطلب» إلى «قليل» لصار المعنى أنه لم يطلب القليل، وليس هذا مراد الشاعر."},{"q":"ما الفرق بين التنازع والاشتغال؟","options":["الاشتغال: عاملان ومعمول واحد، والتنازع: اسم متقدم وعامل مشغول بضميره","التنازع: عاملان ومعمول واحد، والاشتغال: اسم متقدم وعامل مشغول بضميره","التنازع لا يكون إلا بين فعلين لازمين، والاشتغال لا يكون إلا بمتعدٍّ","لا فرق بينهما، فكلاهما عاملان متقدمان يطلبان معمولًا واحدًا متأخرًا"],"answer":1,"feedback":"يظهر ذلك من مثالي المصنف: «ضربني وضربت زيدًا» و«زيدًا ضربته»."},{"q":"ما التوجيه الصحيح لقول الشاعر: «جفَوني ولم أجفُ الأخلاءَ»؟","options":["أُعمل الثاني «أجفُ» في «الأخلاء»، وأُضمر في الأول مرفوعه","«الأخلاء» فاعل «جفوني»، والواو علامة جمع","لا تنازع فيه؛ لأن الفعل الثاني منفي بلم","أُعمل الأول «جفوني» في «الأخلاء»، وأُضمر في الثاني"],"answer":0,"feedback":"مثّل به المصنف لإعمال الثاني مع إضمار مرفوع الأول."},{"q":"كيف يكون المثال «ضربني وضربتُ زيدًا» إذا أُعمل الأول على مذهب الكوفيين؟","options":["ضربني وضربتُ زيدًا","ضربني وضربتُه زيدٌ","ضربوني وضربتُ الزيدين","ضربني زيدًا وضربتُ"],"answer":1,"feedback":"يُرفع «زيد» فاعلًا لـ«ضربني»، ويُضمر في الثاني ما يحتاجه وهو المفعول (الهاء)."},{"q":"على مذهب البصريين في «ضربني وضربتُ زيدًا»، ما فاعل «ضربني»؟","options":["محذوف لا يُقدّر","الياء","ضمير مستتر يعود على «زيد»","«زيدًا»"],"answer":2,"feedback":"أُعمل الثاني في «زيدًا» مفعولًا، فأُضمر في الأول مرفوعه. والياء مفعول به."}]},{"n":26,"main":"المفاعيل","title":"باب المفاعيل: المفعول به","pages":"35","description":"يغطي حكم المفعول وعدد المفاعيل الخمسة، وتعريف المفعول به وتمييزه عن غيره من المنصوبات، مع التطبيق (ص35).","questions":[{"q":"كم عدد المفاعيل عند المصنف؟","options":["أربعة","خمسة","سبعة","ستة"],"answer":1,"feedback":"قال: «المفعول منصوب. وهو خمسة»."},{"q":"ما حكم المفعول من حيث الإعراب عند المصنف؟","options":["منصوب","مجرور","مرفوع","يجوز فيه الرفع والنصب"],"answer":0,"feedback":"افتتح الباب بقوله: «المفعول منصوب»."},{"q":"ما تعريف المفعول به عند المصنف؟","options":["ما فُعل الفعل بمصاحبته","ما وقع عليه فعل الفاعل","ما وقع فيه الفعل","ما فُعل لأجله الفعل"],"answer":1,"feedback":"قال: «المفعول به، وهو ما وقع عليه فعل الفاعل كـ(ضربت زيدًا)»."},{"q":"ما المفاعيل الخمسة التي ذكرها المصنف؟","options":["المفعول به، والمطلق، والحال، والتمييز، والمستثنى","المفعول به، وله، وفيه، ومعه، والمنادى","المفعول به، والمطلق، وله، وفيه، ومعه","المفعول المطلق، وله، وفيه، والحال، والتمييز"],"answer":2,"feedback":"ذكر المصنف بعد المفعول به: المفعول المطلق، والمفعول له، والمفعول فيه، والمفعول معه. والحال والتمييز والمستثنى أبواب مستقلة بعدها، والمنادى جعله من المفعول به."},{"q":"إلى من نسب المصنف الفعل الواقع على المفعول به في تعريفه؟","options":["إلى المنادى","إلى المفعول نفسه","إلى الفاعل","إلى المبتدأ"],"answer":2,"feedback":"قال: «ما وقع عليه فعل الفاعل»."},{"q":"ما الفرق بين «زيدًا» في «ضربتُ زيدًا» و«ضربًا» في «ضربتُ ضربًا»؟","options":["الأول مصدر فهو مفعول مطلق، والثاني وقع عليه الفعل فهو مفعول به","كلاهما وقع عليه فعل الفاعل فهما مفعولان بهما منصوبان","كلاهما مصدر مسلط عليه عامل من لفظه فهما مفعولان مطلقان","الأول وقع عليه الفعل فهو مفعول به، والثاني مصدر فهو مفعول مطلق"],"answer":3,"feedback":"مثّل المصنف بـ«ضربت زيدًا» للمفعول به، وبـ«ضربت ضربًا» للمفعول المطلق."},{"q":"ما الفرق بين المفعول به والمفعول فيه في تعريف المصنف؟","options":["الأول ما وقع فيه الفعل، والثاني ما وقع عليه الفعل","كلاهما ما وقع عليه فعل الفاعل، ولا فرق بينهما","الأول مصدر فضلة، والثاني اسم زمان لا غير","الأول ما وقع عليه الفعل، والثاني ما سُلط عليه عامل على معنى «في»"],"answer":3,"feedback":"عرّف المف  «وأفعل فعل ماض فاعله ضمير ما، وزيدًا مفعول به»."},{"q":"ما شروط الفعل الذي يُبنى منه فعلا التعجب واسم التفضيل؟","options":["ثلاثي، مثبت، غير متفاوت، تام، مبني للمفعول أو للفاعل","رباعي أو ثلاثي، مثبت، متفاوت، تام، ولو كان اسم فاعله على «أفعل»","ثلاثي، منفي أو مثبت، متفاوت، ناقص أو تام، مبني للفاعل","ثلاثي، مثبت، متفاوت، تام، مبني للفاعل، ليس اسم فاعله على «أفعل»"],"answer":3,"feedback":"هذا نص الشروط في المتن."},{"q":"ما أصل صيغة «أفعِلْ به» عند المصنف؟","options":["فعل أمر حقيقي يُطلب به إيقاع الفعل من المخاطب","مصدر منصوب بفعل محذوف، والباء للتعدية","«أفعلَ» بمعنى صار ذا كذا، فغُيّر لفظه وزيدت الباء في فاعله","اسم فعل بمعنى «أتعجب»، والباء أصلية"],"answer":2,"feedback":"قال: «وأصله أفعل أي صار ذا كذا، كـ(أغدّ البعير)... فغُيّر اللفظ، وزيدت الباء في الفاعل لإصلاح اللفظ»."},{"q":"ما الفرق بين الباء في «أحسِن بزيد» والباء في فاعل «كفى»؟","options":["في التعجب لازمة، وفي فاعل «كفى» غير لازمة","كلتاهما غير لازمة، فيجوز حذفهما","كلتاهما لازمة لا تُحذف في أي موضع","الأولى أصلية للتعدية، والثانية زائدة"],"answer":0,"feedback":"قال: «فمن ثمّ لزمت هنا، بخلافها في فاعل كفى»."},{"q":"لماذا لا يُصاغ التعجب مباشرة من «عَوِرَ»؟","options":["لأن اسم فاعله على «أفعل» (أعور)","لأنه مبني للمجهول في الاستعمال","لأنه ليس ثلاثيًا في الأصل","لأنه فعل ناقص لا يكتفي بمرفوعه"],"answer":0,"feedback":"من الشروط: «ليس اسم فاعله على أفعل»."},{"q":"ما إعراب «زيدًا» في «ما أحسنَ زيدًا»؟","options":["مفعول به","خبر","تمييز","حال"],"answer":0,"feedback":"قال المصنف: «وزيدًا مفعول به، والجملة خبر ما»."},{"q":"ما إعراب «زيد» في «أحسِنْ بزيدٍ»؟","options":["مفعول به","اسم مجرور بحرف جر أصلي","تمييز","فاعل مجرور لفظًا بالباء الزائدة"],"answer":3,"feedback":"قال المصنف: «وزيدت الباء في الفاعل لإصلاح اللفظ»."},{"q":"من أي الأفعال الآتية يصح بناء التعجب مباشرة؟","options":["دحرج","كان الناقصة","مات","كرُم"],"answer":3,"feedback":"«كرم» ثلاثي متفاوت تام. أما «مات» فغير متفاوت، و«دحرج» غير ثلاثي، و«كان» ناقصة."}]},{"n":52,"main":"أبواب متفرقة","title":"الوقف ورسم الألف","pages":"57–58","description":"يغطي الوقف على تاء التأنيث وجمع المؤنث والمنقوص والمنون المنصوب، وكتابة الألف بعد واو الجماعة، ورسم الألف ياءً أو ألفًا وطريقة كشف أصلها (ص57–58).","questions":[{"q":"كيف يُوقف في الأفصح على نحو «رحمة»؟","options":["بالألف","بالتاء","بحذف التاء","بالهاء"],"answer":3,"feedback":"قال: «الوقف في الأفصح على نحو رحمة بالهاء»."},{"q":"كيف يُوقف في الأفصح على نحو «مسلمات»؟","options":["بالتاء","بالهاء","بالألف","بحذف التاء"],"answer":0,"feedback":"قال: «وعلى نحو مسلمات بالتاء»."},{"q":"كيف يُوقف في الأفصح على المنقوص المنوَّن نحو «قاضٍ» رفعًا وجرًا؟","options":["بإثبات الياء","بحذف الياء","بالألف","بالهاء"],"answer":1,"feedback":"قال: «وعلى نحو قاضٍ رفعًا وجرًا بالحذف»."},{"q":"كيف يُوقف في الأفصح على نحو «القاضي» رفعًا وجرًا؟","options":["بحذف الياء","بالهاء","بإثبات الياء","بالألف"],"answer":2,"feedback":"قال: «ونحو القاضي فيهما بالإثبات»."},{"q":"متى تُرسم الألف المتطرفة ياءً؟","options":["إذا كان أصلها واوًا، ولو كانت الكلمة ثلاثية","في كل حال، ثلاثية كانت الكلمة أو زائدة","إذا زادت الكلمة على ثلاثة أحرف، أو كان أصلها الياء","إذا كانت في كلمة ثلاثية أصل ألفها واو"],"answer":2,"feedback":"قال: «وتُرسم الألف ياءً إن تجاوزت الثلاثة كـ(استدعى والمصطفى) أو كان أصلها الياء كـ(رمى والفتى)»."},{"q":"ما الفرق بين «قالوا» و«يدعو» في كتابة الألف بعد الواو؟","options":["لا تُكتب في الموضعين؛ لأن الألف لا تُلفظ في الوصل ولا الوقف","تُكتب بعد واو الجماعة في «قالوا»، لا بعد الواو الأصلية في «يدعو»","تُكتب في «يدعو» وحده؛ لأن واوه أصلية من بنية الكلمة","تُكتب في الموضعين؛ لأن كلًّا منهما ينتهي بواو ساكنة في آخره"],"answer":1,"feedback":"قال: «وتُكتب الألف بعد واو الجماعة كـ(قالوا)، دون الأصلية كـ(زيد يدعو)»."},{"q":"كيف يُوقف على المنقوص المنصوب نحو «رأيتُ القاضيَ»؟","options":["بالهاء","بحذف الياء","يجوز الحذف والإثبات","بالياء لا غير"],"answer":3,"feedback":"قال: «وليس في نصب قاضٍ والقاضي إلا الياء»."},{"q":"كيف تُكتب الألف في الفعل «دعا»؟","options":["واوًا","ألفًا","ياءً","يجوز الوجهان"],"answer":1,"feedback":"«دعا» ثلاثي أصل ألفه واو (دعوت)، فتُرسم ألفًا كـ«كفا» و«العصا»."},{"q":"كيف تُكتب الألف في الفعل «استدعى»؟","options":["ياءً؛ لتجاوزه ثلاثة أحرف","يجوز الوجهان؛ لأنه فعل","ألفًا؛ لأن أصل ألفه واو","واوًا؛ لأن أصله من الدعوة"],"answer":0,"feedback":"مثّل المصنف بـ«استدعى» لما تُرسم ألفه ياءً لتجاوزه الثلاثة."},{"q":"بأي طريقة يُعرف أصل الألف في الاسم «الفتى»؟","options":["بالتثنية: «فتيان»","بتصغيره","بإسناده إلى التاء","بجمعه جمع تكسير"],"answer":0,"feedback":"قال: «وينكشف أمر ألف الفعل بالتاء... والاسم بالتثنية كعصوين وفتيين»."}]},{"n":53,"main":"أبواب متفرقة","title":"همزة الوصل","pages":"58–59","description":"يغطي تعريف همزة الوصل، والأسماء التي تبدأ بها، وحركاتها، وهمزة الماضي المتجاوز أربعة أحرف وأمره ومصدره، وهمزة أمر الثلاثي ضمًا وكسرًا (ص58–59).","questions":[{"q":"ما همزة الوصل عند المصنف؟","options":["الهمزة التي تثبت دائمًا","الهمزة التي تثبت في الابتداء وتُحذف في الوصل","الهمزة التي تُحذف دائمًا","الهمزة التي تثبت في الوصل وتُحذف في الابتداء"],"answer":1,"feedback":"قال: «همزة وصل، أي تثبت ابتداءً وتُحذف وصلًا»."},{"q":"ما حركة همزة «اسم» عند المصنف؟","options":["الضم فقط","الفتح فقط","الكسر والضم","الكسر فقط"],"answer":2,"feedback":"قال: «همزة اسم بكسر وضم»."},{"q":"ما نوع الهمزة في الماضي المتجاوز أربعة أحرف كـ«استخرج»؟","options":["لا همزة فيه","يجوز فيها الوصل والقطع","همزة وصل","همزة قطع"],"answer":2,"feedback":"قال: «وكذا همزة الماضي المتجاوز أربعة أحرف، كـ(استخرج)، وأمره ومصدره»."},{"q":"ما حركة همزة الوصل في «الغلام» و«ايمُن الله»؟","options":["الضم وحده في الكلمتين","الفتح، ويجوز الكسر في «ايمن»","همزتهما همزة قطع مفتوحة","الكسر وحده في الكلمتين"],"answer":1,"feedback":"قال: «والغلام وايمن الله في القسم بفتحهما، أو بكسر في ايمن»."},{"q":"ما حركة همزة الوصل في «اُقتُلْ» و«اُغزُ»؟","options":["الكسر","الضم","الفتح","السكون"],"answer":1,"feedback":"قال: «وأمر الثلاثي، كـ(اقتل واغز واغزي) بضمهن»."},{"q":"ما الفرق بين «اُغزي» و«اِمشوا» في حركة همزة الوصل؟","options":["«اغزي» بالكسر، و«امشوا» بالضم","كلاهما بالضم","كلاهما بالكسر","«اغزي» بالضم، و«امشوا» بالكسر"],"answer":3,"feedback":"نص المصنف على ضم «اغزي» وكسر «امشوا»، مع أن ثالث «اغزي» مكسور في اللفظ وثالث «امشوا» مضموم؛ فالعبرة بأصل حركة الحرف الثالث لا بحركته الظاهرة."},{"q":"ما الفرق بين همزة «أكرم» وهمزة «استخرج»؟","options":["«أكرم» وصل، و«استخرج» قطع لتجاوزه أربعة","كلتاهما همزة قطع؛ لأنهما في أول ماض","كلتاهما همزة وصل؛ لأنهما زائدتان","«أكرم» قطع، و«استخرج» وصل لتجاوزه أربعة أحرف"],"answer":3,"feedback":"«أكرم» رباعي لم يتجاوز أربعة أحرف، فلا يدخل في ضابط المصنف."},{"q":"ما نوع الهمزة في مصدر «انطلق» (الانطلاق)؟","options":["همزة وصل","همزة قطع","لا همزة فيه","همزة مفتوحة قطعًا"],"answer":0,"feedback":"«انطلق» ماض تجاوز أربعة أحرف، فهمزته وهمزة أمره ومصدره همزة وصل."},{"q":"ما نوع الهمزة وما حركتها في «اذهَبْ»؟","options":["همزة وصل مكسورة","همزة وصل مضمومة","همزة قطع مفتوحة","همزة وصل مفتوحة"],"answer":0,"feedback":"قال المصنف: «و(اضرب وامشوا واذهب) بكسر كالبواقي»."},{"q":"ما نوع الهمزة في «امرأة» و«ابنة»؟","options":["قطع في «امرأة»، ووصل في «ابنة»","همزة قطع فيهما","همزة وصل فيهما","وصل في «امرأة»، وقطع في «ابنة»"],"answer":2,"feedback":"عدّهما المصنف في الأسماء التي همزتها همزة وصل."}]}]</script>
<script>
(function () {
  document.documentElement.setAttribute('dir', 'rtl');
  document.documentElement.setAttribute('lang', 'ar');
  var QUIZZES = JSON.parse(document.getElementById('quiz-data').textContent);
  var LETTERS = ['أ', 'ب', 'ج', 'د'];
  var app = document.getElementById('app');
  var KEY = 'qatr-scores-v2';

  function loadScores() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function saveScore(n, s) {
    var all = loadScores();
    var prev = all[n];
    all[n] = { last: s, best: Math.max(s, prev ? prev.best : 0) };
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {}
  }
  function ar(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pageLabel(p) { return 'ص' + ar(p); }

  function renderIndex() {
    var scores = loadScores();
    var done = QUIZZES.filter(function (q) { return scores[q.n]; }).length;
    var html = '<header class="top"><span class="eyebrow">متن قطر الندى وبل الصدى · لابن هشام الأنصاري</span>' +
      '<h1>اختبارات قطر الندى</h1>' +
      '<p class="lede">اختبار لكل عنوان من عناوين الفهرس، في كل اختبار عشرة أسئلة. يُصحَّح الاختبار عند الإرسال، وتظهر الإجابة الصحيحة وتعليلها من المتن.</p>' +
      '<div class="stats"><span>الاختبارات: <b>' + ar(QUIZZES.length) + '</b></span><span>الأسئلة: <b>' + ar(QUIZZES.length * 10) + '</b></span><span>أنجزتَ: <b>' + ar(done) + '</b> من ' + ar(QUIZZES.length) + '</span></div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + (100 * done / QUIZZES.length) + '%"></i></div></header>';
    var chapter = null;
    QUIZZES.forEach(function (q, i) {
      if (q.main !== chapter) {
        if (chapter !== null) html += '</div></section>';
        chapter = q.main;
        html += '<section class="chapter"><h2>' + esc(chapter) + '</h2><div class="list">';
      }
      var s = scores[q.n];
      var pill = s ? '<span class="pill ' + (s.best >= 7 ? 'good' : 'weak') + '">أفضل نتيجة ' + ar(s.best) + '/١٠</span>' : '<span class="pill none">لم يُحَل</span>';
      html += '<button class="row" data-n="' + q.n + '"><span class="num">' + ar(q.n) + '</span><span class="rt"><span class="t">' + esc(q.title) + '</span><span class="p">' + pageLabel(q.pages) + '</span></span>' + pill + '</button>';
    });
    html += '</div></section><footer>الأسئلة مستخرجة من نص المتن في النسخة المعتمدة (مكتبة فياض). نتائجك محفوظة في هذا المتصفح فقط.</footer>';
    app.innerHTML = html;
    app.querySelectorAll('.row').forEach(function (b) { b.addEventListener('click', function () { location.hash = 'q-' + b.dataset.n; }); });
  }

  function renderQuiz(quiz) {
    var html = '<button class="back" id="back">→ كل الاختبارات</button>' +
      '<div class="qhead"><span class="meta">' + esc(quiz.main) + ' · ' + pageLabel(quiz.pages) + ' · الاختبار ' + ar(quiz.n) + ' من ' + ar(QUIZZES.length) + '</span>' +
      '<h1>اختبار قطر الندى — ' + esc(quiz.title) + '</h1><p class="desc">' + esc(quiz.description) + '</p></div>' +
      '<div id="score"></div><form id="quiz-form"><ol class="qs">';
    quiz.questions.forEach(function (q, i) {
      html += '<li class="q" id="q' + i + '"><p class="qt"><span class="n">' + ar(i + 1) + '.</span><span>' + esc(q.q) + '</span></p><div class="opts">';
      q.options.forEach(function (o, k) {
        var id = 'q' + quiz.n + '-' + i + '-' + k;
        html += '<label class="opt" for="' + id + '"><input type="radio" name="a' + i + '" id="' + id + '" value="' + k + '"><span class="l">' + LETTERS[k] + '</span><span>' + esc(o) + '</span></label>';
      });
      html += '</div></li>';
    });
    html += '</ol><div class="actions"><button type="submit" class="btn" id="submit">صحّح الاختبار</button><span class="hint" id="hint" hidden></span></div></form>';
    app.innerHTML = html;
    document.getElementById('back').addEventListener('click', function () { location.hash = ''; });
    var form = document.getElementById('quiz-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var answers = quiz.questions.map(function (q, i) { var c = form.querySelector('input[name="a' + i + '"]:checked'); return c ? +c.value : -1; });
      var missing = answers.filter(function (a) { return a < 0; }).length;
      var hint = document.getElementById('hint');
      if (missing && !form.dataset.warned) {
        form.dataset.warned = '1';
        hint.hidden = false;
        hint.textContent = 'بقي ' + ar(missing) + ' بلا إجابة. اضغط «صحّح الاختبار» مرة أخرى لتصحيحه كما هو.';
        return;
      }
      grade(quiz, answers);
    });
    window.scrollTo(0, 0);
  }

  function grade(quiz, answers) {
    var form = document.getElementById('quiz-form');
    var score = 0;
    form.classList.add('locked');
    quiz.questions.forEach(function (q, i) {
      var li = document.getElementById('q' + i);
      var right = answers[i] === q.answer;
      if (right) score++;
      li.classList.add(right ? 'ok' : 'bad');
      li.querySelectorAll('.opt').forEach(function (lab, k) {
        lab.querySelector('input').disabled = true;
        if (k === q.answer) lab.classList.add('correct');
        else if (k === answers[i]) lab.classList.add('wrong');
      });
      var verdict = right ? 'إجابة صحيحة' : (answers[i] < 0 ? 'لم تُجب. الإجابة الصحيحة: (' + LETTERS[q.answer] + ')' : 'إجابة خاطئة. الصحيحة: (' + LETTERS[q.answer] + ')');
      var fb = document.createElement('div');
      fb.className = 'fb';
      fb.innerHTML = '<span class="v">' + verdict + '</span>' + esc(q.feedback);
      li.appendChild(fb);
    });
    saveScore(quiz.n, score);
    var msg = score === 10 ? 'أحسنت، الدرجة كاملة.' : score >= 7 ? 'نتيجة جيدة. راجع الأسئلة المعلَّمة بالأحمر.' : 'راجع الباب في المتن، ثم أعد الاختبار.';
    var next = QUIZZES[QUIZZES.indexOf(quiz) + 1];
    document.getElementById('score').innerHTML = '<div class="score"><span class="big">' + ar(score) + ' / ١٠</span><span class="msg">' + msg + '</span></div>';
    var actions = form.querySelector('.actions');
    actions.innerHTML = '<button type="button" class="btn ghost" id="retry">أعد الاختبار</button>' +
      (next ? '<button type="button" class="btn" id="next">الاختبار التالي: ' + esc(next.title) + '</button>' : '<button type="button" class="btn" id="home">العودة إلى الفهرس</button>');
    document.getElementById('retry').addEventListener('click', function () { renderQuiz(quiz); });
    if (next) document.getElementById('next').addEventListener('click', function () { location.hash = 'q-' + next.n; });
    else document.getElementById('home').addEventListener('click', function () { location.hash = ''; });
    document.getElementById('score').scrollIntoView({ block: 'start' });
  }

  function route() {
    var m = /^#q-(\d+)$/.exec(location.hash);
    var quiz = m && QUIZZES.filter(function (q) { return q.n === +m[1]; })[0];
    if (quiz) renderQuiz(quiz); else renderIndex();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
